# =============================================================================
# Production Docker Compose - uses pre-built images from DockerHub
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Override version:
#   CODEHUB_VERSION=0.2.1 docker compose -f docker-compose.prod.yml up -d
# =============================================================================

# External DNS servers for VPN/network stability
x-dns: &dns
  dns:
    - 8.8.8.8
    - 1.1.1.1
  dns_opt:
    - use-vc

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-restart: &restart
  restart: unless-stopped

# CP-only environment variables (no S3, no Docker — CP is a gatekeeper)
x-cp-env: &cp-env
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql+asyncpg://codehub:codehub@postgres:5432/codehub
  REDIS_URL: redis://redis:6379

# =============================================================================
# Services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Core Application (pre-built images)
  # ---------------------------------------------------------------------------

  # Networks: dp-net only (isolated from CP; reachable via FRP tunnel)
  agent:
    image: cagojeiger/codehub-agent:${CODEHUB_VERSION:-0.2.1}
    container_name: codehub-agent
    ports:
      - "0.0.0.0:18081:8081"
    environment:
      AGENT_CLUSTER_ID: default
      AGENT_RESOURCE_PREFIX: codehub-ws-
      AGENT_DOCKER_HOST: tcp://docker-proxy:2375
      AGENT_DOCKER_NETWORK: codehub-dp-net
      AGENT_S3_ENDPOINT: http://minio:9000
      AGENT_S3_INTERNAL_ENDPOINT: http://minio:9000
      AGENT_S3_BUCKET: codehub-archives
      AGENT_S3_ACCESS_KEY: codehub
      AGENT_S3_SECRET_KEY: codehub123
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8081"
      RUNTIME_STORAGE_JOB_IMAGE: cagojeiger/codehub-storage-job:${CODEHUB_VERSION:-0.2.1}
    depends_on:
      minio:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dp-net
    <<: [*dns, *logging, *restart]

  # Networks: cp-net only (CP is a gatekeeper — no direct access to MinIO/Docker)
  control-plane:
    image: cagojeiger/codehub-control-plane:${CODEHUB_VERSION:-0.2.1}
    container_name: codehub-control-plane
    ports:
      - "0.0.0.0:18000:8000"
    environment:
      <<: *cp-env
      WORKERS: "3"
      AGENT_ENDPOINT: http://frps:6100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # agent dependency removed — CP is a Hub that starts independently.
      # Agent connects via FRP tunnel (or cp-net for local dev).
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - cp-net
    <<: [*dns, *restart]

  migrate:
    image: cagojeiger/codehub-control-plane:${CODEHUB_VERSION:-0.2.1}
    container_name: codehub-migrate
    command: uv run alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://codehub:codehub@postgres:5432/codehub
    networks:
      - cp-net
    <<: *dns

  # ---------------------------------------------------------------------------
  # Database & Storage
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:17
    container_name: codehub-postgres
    environment:
      POSTGRES_USER: codehub
      POSTGRES_PASSWORD: codehub
      POSTGRES_DB: codehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U codehub" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    networks:
      - cp-net
    <<: [*dns, *logging, *restart]

  redis:
    image: redis:7
    container_name: codehub-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25
    networks:
      - cp-net
    <<: [*dns, *logging, *restart]

  minio:
    image: minio/minio
    container_name: codehub-minio
    command: server /data --console-address ":9001"
    ports:
      - "0.0.0.0:19001:9001"
    environment:
      MINIO_ROOT_USER: codehub
      MINIO_ROOT_PASSWORD: codehub123
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    networks:
      - dp-net
    <<: [*dns, *logging, *restart]

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # FRP Tunnel (Hub-Spoke communication)
  # ---------------------------------------------------------------------------

  # FRP Server — sits in cp-net (reachable by CP) + tunnel-net (reachable by frpc)
  frps:
    image: ghcr.io/fatedier/frps:v0.67.0
    container_name: codehub-frps
    command: ["-c", "/etc/frp/frps.toml"]
    volumes:
      - ./infra/frp/frps.toml:/etc/frp/frps.toml:ro
    mem_limit: 64m
    cpus: 0.25
    networks:
      - cp-net
      - tunnel-net
    <<: [*logging, *restart]

  # FRP Client — sits in dp-net (reaches Agent) + tunnel-net (reaches frps)
  frpc:
    image: ghcr.io/fatedier/frpc:v0.67.0
    container_name: codehub-frpc
    command: ["-c", "/etc/frp/frpc.toml"]
    volumes:
      - ./infra/frp/frpc.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - frps
      - agent
    mem_limit: 64m
    cpus: 0.25
    networks:
      - dp-net
      - tunnel-net
    <<: [*logging, *restart]

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: codehub-docker-proxy
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - IMAGES=1
      - INFO=1
      - VERSION=1
      - POST=1
      - VOLUMES=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: 0.25
    networks:
      - dp-net
    <<: [*dns, *logging, *restart]

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: codehub-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      control-plane:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    networks:
      - cp-net
      - dp-net
    <<: [*dns, *restart]

  grafana:
    image: grafana/grafana:12.3.1
    container_name: codehub-grafana
    ports:
      - "0.0.0.0:13000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=qwer1234
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus
    mem_limit: 256m
    cpus: 0.5
    networks:
      - cp-net
    <<: [*dns, *restart]

# =============================================================================
# Networks & Volumes
# =============================================================================

networks:
  cp-net:
    name: codehub-cp-net
    driver: bridge
  dp-net:
    name: codehub-dp-net
    driver: bridge
  tunnel-net:
    name: codehub-tunnel-net
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
