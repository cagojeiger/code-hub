# =============================================================================
# Common Configuration (YAML Anchors)
# =============================================================================

# External DNS servers for VPN/network stability
# Docker Desktop 4.48.0+ has DNS routing issues with VPN
# See: https://github.com/docker/for-mac/issues/4751
x-dns: &dns
  dns:
    - 8.8.8.8
    - 1.1.1.1
  dns_opt:
    - use-vc  # Force TCP for DNS queries (more stable with VPN)

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-restart: &restart
  restart: unless-stopped

# CP-only environment variables (no S3, no Docker — CP is a gatekeeper)
x-cp-env: &cp-env
  PYTHONUNBUFFERED: "1"
  DATABASE_URL: postgresql+asyncpg://codehub:codehub@postgres:5432/codehub
  REDIS_URL: redis://redis:6379

# =============================================================================
# Services
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Core Application
  # ---------------------------------------------------------------------------

  # Agent - Runtime agent for Docker operations
  # Networks: dp-net (own infra: minio, docker-proxy) + cp-net (Hub communication, simulates FRP tunnel)
  agent:
    build:
      context: src
      dockerfile: Dockerfile.agent
    container_name: codehub-agent
    ports:
      - "0.0.0.0:18081:8081"
    environment:
      AGENT_CLUSTER_ID: default
      AGENT_RESOURCE_PREFIX: codehub-ws-
      AGENT_DOCKER_HOST: tcp://docker-proxy:2375
      AGENT_DOCKER_NETWORK: codehub-dp-net
      AGENT_S3_ENDPOINT: http://minio:9000
      AGENT_S3_INTERNAL_ENDPOINT: http://minio:9000
      AGENT_S3_BUCKET: codehub-archives
      AGENT_S3_ACCESS_KEY: codehub
      AGENT_S3_SECRET_KEY: codehub123
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8081"
    depends_on:
      minio:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dp-net
      - cp-net
    <<: [*dns, *logging, *restart]

  # Control Plane - API, Reconciler, Coordinator
  # Networks: cp-net only (CP is a gatekeeper — no direct access to MinIO/Docker)
  control-plane:
    build:
      context: src
      dockerfile: Dockerfile
    container_name: codehub-control-plane
    ports:
      - "0.0.0.0:18000:8000"
    environment:
      <<: *cp-env
      WORKERS: "3"
      AGENT_ENDPOINT: http://agent:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - cp-net
    <<: [*dns, *restart]

  # Database migration - runs once before control-plane starts
  migrate:
    build:
      context: src
      dockerfile: Dockerfile
    container_name: codehub-migrate
    command: uv run alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://codehub:codehub@postgres:5432/codehub
    networks:
      - cp-net
    <<: *dns
    # No restart - runs once and exits

  # ---------------------------------------------------------------------------
  # Database & Storage
  # ---------------------------------------------------------------------------

  # PostgreSQL Database (CP infrastructure)
  postgres:
    image: postgres:17
    container_name: codehub-postgres
    environment:
      POSTGRES_USER: codehub
      POSTGRES_PASSWORD: codehub
      POSTGRES_DB: codehub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U codehub" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    networks:
      - cp-net
    <<: [*dns, *logging, *restart]

  # Redis - Pub/Sub for SSE event broadcasting (CP infrastructure)
  redis:
    image: redis:7
    container_name: codehub-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25
    networks:
      - cp-net
    <<: [*dns, *logging, *restart]

  # MinIO - Object Storage (Agent/DP infrastructure)
  minio:
    image: minio/minio
    container_name: codehub-minio
    command: server /data --console-address ":9001"
    ports:
      - "0.0.0.0:19001:9001"
    environment:
      MINIO_ROOT_USER: codehub
      MINIO_ROOT_PASSWORD: codehub123
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    networks:
      - dp-net
    <<: [*dns, *logging, *restart]

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  # Docker Socket Proxy - Secure Docker API access (Agent/DP infrastructure)
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: codehub-docker-proxy
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - IMAGES=1
      - INFO=1
      - VERSION=1
      - POST=1
      - VOLUMES=1
      # Archive/Restore helper container support
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m
    cpus: 0.25
    networks:
      - dp-net
    <<: [*dns, *logging, *restart]

  # Storage Job - Archive/Restore helper container (build only)
  storage-job:
    build:
      context: containers/storage-job
    image: codehub/storage-job:latest
    deploy:
      replicas: 0 # Build image but don't run container
    networks:
      - dp-net
    <<: *dns

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------

  # Prometheus - Metrics collection (needs both networks to scrape CP and Agent)
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: codehub-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      control-plane:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    networks:
      - cp-net
      - dp-net
    <<: [*dns, *restart]

  # Grafana - Metrics visualization (CP-side, talks to Prometheus)
  grafana:
    image: grafana/grafana:12.3.1
    container_name: codehub-grafana
    ports:
      - "0.0.0.0:13000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=qwer1234
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      - prometheus
    mem_limit: 256m
    cpus: 0.5
    networks:
      - cp-net
    <<: [*dns, *restart]

  # ---------------------------------------------------------------------------
  # Development & Testing
  # ---------------------------------------------------------------------------

  # Test runner - needs both networks (tests exercise full stack)
  test:
    build:
      context: src
      dockerfile: Dockerfile.test
    container_name: codehub-test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    environment:
      <<: *cp-env
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: codehub
      S3_SECRET_KEY: codehub123
      DOCKER_HOST: tcp://docker-proxy:2375
    profiles:
      - test
    networks:
      - cp-net
      - dp-net
    <<: *dns
    # No restart - runs once and exits

# =============================================================================
# Networks & Volumes
# =============================================================================

networks:
  cp-net:
    name: codehub-cp-net
    driver: bridge
  dp-net:
    name: codehub-dp-net
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
