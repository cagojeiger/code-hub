name: API Validation

on:
  push:
    paths:
      - 'api/**'
      - 'src/codehub_agent/api/v1/schemas.py'
      - 'src/codehub/core/schemas/agent_api.py'
      - 'scripts/generate-schemas.sh'
  pull_request:
    paths:
      - 'api/**'
      - 'src/codehub_agent/api/v1/schemas.py'
      - 'src/codehub/core/schemas/agent_api.py'
      - 'scripts/generate-schemas.sh'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.3"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install openapi-spec-validator datamodel-code-generator

      - name: Validate OpenAPI spec
        run: openapi-spec-validator api/openapi.yaml

      - name: Generate schemas
        run: ./scripts/generate-schemas.sh

      - name: Verify schemas are up to date
        run: |
          if ! git diff --exit-code src/codehub_agent/api/v1/schemas.py; then
            echo "Error: Generated Agent schema is out of date. Run ./scripts/generate-schemas.sh"
            exit 1
          fi
          if ! git diff --exit-code src/codehub/core/schemas/agent_api.py; then
            echo "Error: Generated WC schema is out of date. Run ./scripts/generate-schemas.sh"
            exit 1
          fi
