name: Docker Image Publish

on:
  push:
    branches: [main]
    paths:
      - 'src/Dockerfile'
      - 'src/Dockerfile.agent'
      - 'src/codehub/**'
      - 'src/codehub_agent/**'
      - 'src/pyproject.toml'
      - 'containers/storage-job/**'
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build (control-plane, agent, storage-job, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - control-plane
          - agent
          - storage-job

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "
          import re, sys
          from pathlib import Path
          m = re.search(r'__version__\s*=\s*\"([^\"]+)\"', Path('src/codehub/__init__.py').read_text())
          if not m or not m.group(1).strip():
              sys.exit(1)
          print(m.group(1).strip())
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Version: $VERSION"

  select-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: set-matrix
        env:
          IMAGE_INPUT: ${{ inputs.image }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os

          all_images = [
            {"name": "control-plane", "context": "./src", "dockerfile": "./src/Dockerfile", "image": "codehub-control-plane"},
            {"name": "agent", "context": "./src", "dockerfile": "./src/Dockerfile.agent", "image": "codehub-agent"},
            {"name": "storage-job", "context": "./containers/storage-job", "dockerfile": "./containers/storage-job/Dockerfile", "image": "codehub-storage-job"},
          ]

          choice = (os.environ.get("IMAGE_INPUT") or "").strip() or "all"
          selected = all_images if choice == "all" else [i for i in all_images if i["name"] == choice]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'include': selected})}\n")
          print(f"Selected: {', '.join(i['name'] for i in selected)}")
          PY

  build-and-push:
    needs: [get-version, select-images]
    if: needs.select-images.outputs.matrix != '' && needs.select-images.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.get-version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
