name: Slack Notifications

on:
  workflow_run:
    workflows:
      - "Docker Image Publish"
      - "API Validation"
    types:
      - completed

jobs:
  notify-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          PAYLOAD=$(jq -n \
            --arg wf "$WORKFLOW_NAME" \
            --arg br "$BRANCH" \
            --arg ac "$ACTOR" \
            --arg url "$WORKFLOW_URL" \
            '{
              text: "code-hub CI failed",
              blocks: [
                {type: "section", text: {type: "mrkdwn", text: ("*Workflow:* " + $wf + "\n*Branch:* " + $br + "\n*Actor:* " + $ac)}},
                {type: "actions", elements: [{type: "button", text: {type: "plain_text", text: "View Details"}, url: $url}]}
              ]
            }')
          curl -sf -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
